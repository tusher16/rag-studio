<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RAG Studio — Pipeline</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0d12;
    --bg-1: #0f1218;
    --bg-2: #11141b;
    --bg-3: #161a23;
    --bg-hover: #181c26;
    --line: #1d212c;
    --line-2: #262b38;
    --fg: #e6e8ee;
    --fg-2: #b4b8c4;
    --fg-3: #7a8090;
    --fg-4: #525866;
    --accent: #4dd0c1;
    --accent-dim: #1f3b3b;
    --accent-faint: rgba(77, 208, 193, 0.08);
    --green: #5bd07f;
    --yellow: #e6c64a;
    --red: #e5707a;
    --purple: #a78bfa;
    --blue: #6aa6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: 'Geist', system-ui, sans-serif; font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "ss02", "cv11";
  }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: "ss01", "ss02"; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  textarea { font: inherit; color: inherit; background: none; border: none; outline: none; resize: none; }
  #root { min-height: 100vh; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25 } 40% { opacity: 1 } }
  .dot-1 { animation: blink 1.2s infinite both; }
  .dot-2 { animation: blink 1.2s infinite both; animation-delay: 0.16s; }
  .dot-3 { animation: blink 1.2s infinite both; animation-delay: 0.32s; }
  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #1f2330; border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

/* ---------- icons (stroke, 16px) ---------- */
const Icon = ({ name, size = 16 }) => {
  const props = { width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", strokeWidth: 1.6, strokeLinecap: "round", strokeLinejoin: "round" };
  const paths = {
    pipeline: <><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M7 11l10-4M7 13l10 4"/></>,
    chat: <><path d="M4 5h16v11H9l-4 4V5z"/></>,
    retrieval: <><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></>,
    eval: <><path d="M4 19V5M4 19h16"/><rect x="7" y="11" width="3" height="8"/><rect x="12" y="7" width="3" height="12"/><rect x="17" y="14" width="3" height="5"/></>,
    docs: <><path d="M6 4h9l3 3v13H6z"/><path d="M15 4v3h3M9 11h6M9 14h6M9 17h4"/></>,
    play: <><path d="M7 5l12 7-12 7V5z" fill="currentColor" stroke="none"/></>,
    settings: <><circle cx="12" cy="12" r="2.5"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></>,
    refresh: <><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></>,
    chevron: <><path d="M9 6l6 6-6 6"/></>,
    source: <><path d="M4 7h16v12H4z"/><path d="M4 10h16"/><circle cx="7" cy="8.5" r="0.4" fill="currentColor"/><circle cx="9" cy="8.5" r="0.4" fill="currentColor"/></>,
    chunk: <><rect x="3" y="4" width="7" height="7"/><rect x="14" y="4" width="7" height="7"/><rect x="3" y="13" width="7" height="7"/><rect x="14" y="13" width="7" height="7"/></>,
    embed: <><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16M6 6l12 12M18 6L6 18" opacity="0.5"/></>,
    db: <><ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6"/><path d="M5 12v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-6"/></>,
    dot: <><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></>,
    plus: <><path d="M12 5v14M5 12h14"/></>,
    more: <><circle cx="6" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"/></>,
    cmd: <><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6z"/></>,
    branch: <><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v10M8 5h4a4 4 0 0 1 4 4v1"/></>,
    clock: <><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></>,
  };
  return <svg {...props}>{paths[name]}</svg>;
};

/* ---------- sidebar ---------- */
const NAV = [
  { id: "pipeline", label: "Pipeline", icon: "pipeline" },
  { id: "chat", label: "Chat", icon: "chat" },
  { id: "retrieval", label: "Retrieval", icon: "retrieval" },
  { id: "evaluation", label: "Evaluation", icon: "eval" },
  { id: "docs", label: "Docs", icon: "docs" },
];

function Sidebar({ active, setActive }) {
  return (
    <aside style={{
      width: 232, borderRight: "1px solid var(--line)", background: "var(--bg-1)",
      display: "flex", flexDirection: "column", flexShrink: 0, height: "100vh", position: "sticky", top: 0
    }}>
      {/* Logo */}
      <div style={{ padding: "20px 20px 22px", display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{
          width: 22, height: 22, borderRadius: 5, background: "var(--accent)",
          display: "grid", placeItems: "center", color: "#08221f", fontWeight: 700,
          fontFamily: "'Geist Mono'", fontSize: 12
        }}>R</div>
        <div style={{ fontWeight: 600, letterSpacing: -0.1, fontSize: 13.5 }}>RAG Studio</div>
        <div style={{ marginLeft: "auto", color: "var(--fg-4)" }}>
          <Icon name="chevron" size={14} />
        </div>
      </div>

      {/* Workspace */}
      <div style={{ padding: "0 12px 14px" }}>
        <div style={{
          padding: "8px 10px", borderRadius: 6, background: "var(--bg-2)", border: "1px solid var(--line)",
          display: "flex", alignItems: "center", gap: 8
        }}>
          <div style={{ width: 18, height: 18, borderRadius: 4, background: "#2a2333", display: "grid", placeItems: "center", color: "var(--purple)", fontSize: 10, fontWeight: 600 }}>AC</div>
          <div style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
            <div style={{ fontSize: 12, fontWeight: 500, lineHeight: 1.2 }}>rag-studio</div>
            <div style={{ fontSize: 10.5, color: "var(--fg-3)", lineHeight: 1.2 }} className="mono">v1</div>
          </div>
          <div style={{ marginLeft: "auto", color: "var(--fg-4)" }}>
            <Icon name="chevron" size={12} />
          </div>
        </div>
      </div>

      {/* Nav */}
      <nav style={{ padding: "0 8px", display: "flex", flexDirection: "column", gap: 1 }}>
        <div style={{ fontSize: 10.5, color: "var(--fg-4)", padding: "8px 12px 4px", letterSpacing: 0.5, textTransform: "uppercase", fontWeight: 500 }}>
          Workspace
        </div>
        {NAV.map(item => {
          const isActive = active === item.id;
          return (
            <button key={item.id} onClick={() => setActive(item.id)}
              style={{
                display: "flex", alignItems: "center", gap: 10, padding: "7px 12px",
                borderRadius: 6, color: isActive ? "var(--fg)" : "var(--fg-2)",
                background: isActive ? "var(--bg-3)" : "transparent",
                fontSize: 13, fontWeight: isActive ? 500 : 400,
                position: "relative", textAlign: "left",
              }}
              onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = "var(--bg-hover)"; }}
              onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = "transparent"; }}>
              {isActive && <div style={{ position: "absolute", left: -8, top: 8, bottom: 8, width: 2, background: "var(--accent)", borderRadius: 2 }}/>}
              <span style={{ color: isActive ? "var(--accent)" : "var(--fg-3)" }}>
                <Icon name={item.icon} />
              </span>
              <span>{item.label}</span>
              {item.id === "chat" && (
                <span className="mono" style={{ marginLeft: "auto", fontSize: 10, color: "var(--fg-4)", border: "1px solid var(--line-2)", padding: "1px 5px", borderRadius: 3 }}>3</span>
              )}
            </button>
          );
        })}
      </nav>

      {/* Pipelines list (contextual) */}
      <div style={{ padding: "20px 8px 0" }}>
        <div style={{ fontSize: 10.5, color: "var(--fg-4)", padding: "0 12px 6px", letterSpacing: 0.5, textTransform: "uppercase", fontWeight: 500, display: "flex", alignItems: "center" }}>
          Pipelines
          <button style={{ marginLeft: "auto", color: "var(--fg-4)" }}><Icon name="plus" size={12} /></button>
        </div>
        {[
          { name: "layoutlmv3.2404.10848v1", status: "green", active: true },
        ].map(p => (
          <button key={p.name} style={{
            display: "flex", alignItems: "center", gap: 8, padding: "5px 12px", borderRadius: 6,
            width: "100%", textAlign: "left", color: p.active ? "var(--fg)" : "var(--fg-2)",
            background: p.active ? "var(--bg-2)" : "transparent", fontSize: 12.5,
          }}>
            <span style={{ color: `var(--${p.status})`, display: "flex" }}>
              <Icon name="dot" size={8} />
            </span>
            <span className="mono" style={{ fontSize: 12 }}>{p.name}</span>
          </button>
        ))}
      </div>

      <div style={{ flex: 1 }} />

      {/* Bottom */}
      <div style={{ padding: "12px 16px", borderTop: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 10, color: "var(--fg-3)" }}>
        <div style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--green)" }} />
        <span className="mono" style={{ fontSize: 11 }}>RAG v1</span>
        <span style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
          <button style={{ color: "var(--fg-4)" }}><Icon name="settings" size={14} /></button>
        </span>
      </div>
    </aside>
  );
}

/* ---------- top header ---------- */
function Header({ title }) {
  return (
    <header style={{
      borderBottom: "1px solid var(--line)", padding: "0 32px", height: 56,
      display: "flex", alignItems: "center", gap: 16, background: "var(--bg)", position: "sticky", top: 0, zIndex: 5
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--fg-3)", fontSize: 12.5 }}>
        <span className="mono">rag-studio</span>
        <span style={{ color: "var(--fg-4)" }}>/</span>
        <span style={{ color: "var(--fg)", fontWeight: 500 }}>{title}</span>
      </div>

      <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
        <div style={{
          display: "flex", alignItems: "center", gap: 8, padding: "5px 10px",
          border: "1px solid var(--line)", borderRadius: 6, background: "var(--bg-2)",
          color: "var(--fg-3)", fontSize: 12, minWidth: 220
        }}>
          <Icon name="retrieval" size={13} />
          <span>Search pipelines, runs, chunks…</span>
          <span className="mono" style={{ marginLeft: "auto", fontSize: 10.5, border: "1px solid var(--line-2)", padding: "0 5px", borderRadius: 3 }}>⌘K</span>
        </div>
        <a href="https://github.com/tusher16/rag-studio" target="_blank" rel="noopener noreferrer" style={{
          display: "flex", alignItems: "center", gap: 6, padding: "6px 10px",
          border: "1px solid var(--line)", borderRadius: 6, color: "var(--fg-2)", fontSize: 12,
          textDecoration: "none",
        }}>
          <Icon name="branch" size={13} />
          <span className="mono">github</span>
        </a>
        <input
          type="file"
          id="file-upload"
          accept=".pdf,.csv"
          style={{ display: "none" }}
          onChange={async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const formData = new FormData();
          formData.append("file", file);
          const btn = document.getElementById("upload-btn");
          btn.innerText = "Uploading...";

          try {
            await fetch("/api/ingest", { method: "POST", body: formData });

            // Poll status
            const poll = setInterval(async () => {
              const res = await fetch("/api/ingest/status");
              const data = await res.json();
              btn.innerText = data.state + " · " + data.message;
              if (data.state === "complete" || data.state === "failed") {
                clearInterval(poll);
                btn.innerText = data.state === "complete" ? "✓ " + data.filename : "✗ " + data.message;
              }
            }, 2000);
          } catch (err) {
            btn.innerText = "✗ Failed";
          }
        }}
        />
        <button
          id="upload-btn"
          onClick={() => document.getElementById("file-upload").click()}
          style={{
            display: "flex", alignItems: "center", gap: 6, padding: "6px 12px",
            background: "var(--accent)", color: "#08221f", borderRadius: 6, fontSize: 12, fontWeight: 600
          }}>
          <Icon name="play" size={11} />
          <span>Upload & Ingest</span>
        </button>
      </div>
    </header>
  );
}

/* ---------- pipeline stage card ---------- */
function StageCard({ stage }) {
  const statusColor = { ready: "var(--green)", processing: "var(--yellow)", idle: "var(--fg-4)" }[stage.status];
  return (
    <div style={{
      width: 248, background: "var(--bg-2)", border: "1px solid var(--line)", borderRadius: 8,
      display: "flex", flexDirection: "column", overflow: "hidden",
    }}>
      {/* head */}
      <div style={{ padding: "12px 14px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{
          width: 26, height: 26, borderRadius: 6, background: "var(--bg-3)",
          border: "1px solid var(--line-2)", display: "grid", placeItems: "center", color: "var(--accent)"
        }}>
          <Icon name={stage.icon} size={14} />
        </div>
        <div style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
          <div style={{ fontSize: 10, color: "var(--fg-4)", textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 500 }}>{stage.kind}</div>
          <div style={{ fontWeight: 600, fontSize: 13, lineHeight: 1.2 }}>{stage.name}</div>
        </div>
        <button style={{ marginLeft: "auto", color: "var(--fg-4)" }}><Icon name="more" size={14} /></button>
      </div>

      {/* config */}
      <div style={{ padding: "10px 14px", display: "flex", flexDirection: "column", gap: 6 }}>
        {stage.config.map(([k, v, type]) => (
          <div key={k} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12 }}>
            <span style={{ color: "var(--fg-3)" }} className="mono">{k}</span>
            <span className="mono" style={{
              color: type === "accent" ? "var(--accent)" : type === "muted" ? "var(--fg-3)" : "var(--fg)",
              fontSize: 12,
            }}>{v}</span>
          </div>
        ))}
      </div>

      {/* footer */}
      <div style={{ padding: "9px 14px", borderTop: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 8, background: "var(--bg-1)" }}>
        <div style={{ width: 6, height: 6, borderRadius: "50%", background: statusColor, boxShadow: stage.status === "processing" ? "0 0 0 3px rgba(230,198,74,0.12)" : "none" }} />
        <span style={{ fontSize: 11.5, color: "var(--fg-2)", textTransform: "capitalize" }}>{stage.status}</span>
        <span className="mono" style={{ marginLeft: "auto", fontSize: 11, color: "var(--fg-3)" }}>{stage.meta}</span>
      </div>
    </div>
  );
}

/* ---------- arrow between stages ---------- */
function Arrow({ active }) {
  return (
    <div style={{ display: "flex", alignItems: "center", flexShrink: 0, height: 248 }}>
      <svg width="44" height="14" viewBox="0 0 44 14" fill="none">
        <path d="M0 7 H38" stroke={active ? "var(--accent)" : "var(--line-2)"} strokeWidth="1.2" strokeDasharray={active ? "0" : "3 3"} />
        <path d="M34 2 L42 7 L34 12" stroke={active ? "var(--accent)" : "var(--line-2)"} strokeWidth="1.2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    </div>
  );
}

/* ---------- pipeline page ---------- */
const STAGES = [
  {
    id: "source", kind: "Source", name: "Local upload: PDF", icon: "source", status: "ready", meta: "PDF ingestion",
    config: [
      ["type", "pdf", "muted"],
      ["loader", "pdfplumber"],
      ["chars/page", "~3000"],
    ],
  },
  {
    id: "chunker", kind: "Chunker", name: "Recursive", icon: "chunk", status: "ready", meta: "RecursiveCharacterTextSplitter",
    config: [
      ["strategy", "recursive", "muted"],
      ["chunk_size", "512", "accent"],
      ["overlap", "64", "accent"],
      ["separator", "\\n\\n"],
    ],
  },
  {
    id: "embedder", kind: "Embedder", name: "BGE-M3", icon: "embed", status: "ready", meta: "BAAI/bge-m3",
    config: [
      ["model", "BAAI/bge-m3", "muted"],
      ["dim", "1024", "accent"],
      ["device", "cpu"],
      ["normalize", "true"],
    ],
  },
  {
    id: "store", kind: "Vector DB", name: "ChromaDB", icon: "db", status: "ready", meta: "collection: production_rag",
    config: [
      ["provider", "chromadb", "muted"],
      ["metric", "cosine"],
      ["index", "HNSW"],
      ["persist", "./chroma_db"],
    ],
  },
];

function Pipeline() {
  const [stats, setStats] = useState({ documents: "—", chunks: "—", vectors: "—", last_run: "—" });
  React.useEffect(() => {
    fetch("/api/stats").then(r => r.json()).then(setStats);
  }, []);
  return (
    <div style={{ padding: "28px 32px 60px", maxWidth: 1240 }}>
      {/* Page title + summary row */}
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 24, gap: 32 }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
            <h1 style={{ margin: 0, fontSize: 22, fontWeight: 600, letterSpacing: -0.3 }}>Pipeline</h1>
          </div>
          <div style={{ color: "var(--fg-3)", fontSize: 13 }}>
            Define how documents flow from source to vector store. Changes apply on next run.
          </div>
        </div>

        <div style={{ display: "flex", gap: 24, paddingTop: 4 }}>
          {[
            ["Documents", stats.documents, null],
            ["Chunks", stats.chunks, null],
            ["Vectors", stats.vectors, null],
            ["Last run", stats.last_run, "var(--fg-3)"],
          ].map(([k, v, c]) => (
            <div key={k} style={{ display: "flex", flexDirection: "column", gap: 2, minWidth: 84 }}>
              <div style={{ fontSize: 10.5, color: "var(--fg-4)", textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 500 }}>{k}</div>
              <div className="mono" style={{ fontSize: 18, fontWeight: 500, color: c || "var(--fg)", letterSpacing: -0.3 }}>{v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Flow diagram */}
      <div style={{
        border: "1px solid var(--line)", borderRadius: 10, background: "var(--bg-1)",
        padding: "32px 28px", marginBottom: 24, overflowX: "auto",
      }}>
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "flex-start",
          gap: 0, minWidth: "fit-content"
        }}>
          {STAGES.map((s, i) => (
            <React.Fragment key={s.id}>
              <StageCard stage={s} />
              {i < STAGES.length - 1 && <Arrow active={i < 2} />}
            </React.Fragment>
          ))}
        </div>

        {/* Token flow legend */}
        <div style={{
          marginTop: 28, paddingTop: 20, borderTop: "1px dashed var(--line)",
          display: "flex", alignItems: "center", gap: 32, fontSize: 11.5, color: "var(--fg-3)"
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 18, height: 1.5, background: "var(--accent)" }} />
            <span>Active flow</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 18, height: 1.5, backgroundImage: "linear-gradient(to right, var(--line-2) 50%, transparent 0)", backgroundSize: "6px 1.5px", backgroundRepeat: "repeat-x" }} />
            <span>Pending</span>
          </div>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 16 }}>
            <span className="mono">runtime: <span style={{ color: "var(--fg)" }}>local CPU</span></span>
            <span className="mono">cost: <span style={{ color: "var(--fg)" }}>$0.00</span></span>
          </div>
        </div>
      </div>

    </div>
  );
}

/* ---------- chat ---------- */

/* simple markdown-ish: backticks → mono spans, paragraphs split on \n\n */
function renderText(text) {
  return text.split(/\n\n+/).map((para, i) => {
    const parts = para.split(/(`[^`]+`)/g);
    return (
      <p key={i} style={{ margin: i === 0 ? "0 0 12px" : "0 0 12px", lineHeight: 1.65, color: "var(--fg)" }}>
        {parts.map((p, j) =>
          p.startsWith("`") && p.endsWith("`")
            ? <span key={j} className="mono" style={{
                fontSize: "92%", background: "var(--bg-3)", padding: "1px 5px",
                borderRadius: 4, border: "1px solid var(--line)", color: "var(--accent)"
              }}>{p.slice(1, -1)}</span>
            : <React.Fragment key={j}>{p}</React.Fragment>
        )}
      </p>
    );
  });
}

function Chat({ messages, setMessages, loading, setLoading }) {
  const scrollRef = React.useRef(null);

  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages.length, loading]);

  const send = async (text) => {
    setMessages(m => [...m, { role: "user", text }]);
    setLoading(true);
    
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: text }),
      });
      const data = await res.json();
      setMessages(m => [...m, { 
        role: "assistant", 
        text: data.answer || "No answer returned",
        citations: [] 
      }]);
    } catch (err) {
      setMessages(m => [...m, { 
        role: "assistant", 
        text: "Error: " + err.message,
        citations: [] 
      }]);
    } finally {
      setLoading(false);
    }
  };

  const isEmpty = messages.length === 0 && !loading;

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      {isEmpty ? (
        <EmptyState onPick={send} />
      ) : (
        <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "28px 0 12px" }}>
          <div style={{ maxWidth: 820, margin: "0 auto", padding: "0 32px" }}>
            {messages.map((m, i) =>
              m.role === "user"
                ? <UserMessage key={i} text={m.text} />
                : <AssistantMessage key={i} msg={m} />
            )}
            {loading && <TypingIndicator />}
          </div>
        </div>
      )}
      <ChatInput onSend={send} />
    </div>
  );
}

function Retrieval({ query, setQuery, executed, setExecuted, results: realResults, setResults: setRealResults, loading, setLoading, selected, setSelected }) {

  const results = executed ? realResults : [];
  const selectedChunk = results.find(r => r.rank === selected);

  const run = async (q) => {
    const text = (q ?? query).trim();
    if (!text) return;
    setLoading(true);
    setExecuted("");
    try {
      const res = await fetch("/api/retrieve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text }),
      });
      const data = await res.json();
      const mapped = data.results.map((r, i) => ({
        rank: r.rank,
        file: r.source,
        chunk: `chunk_${String(i).padStart(4, "0")}`,
        page: `p. ${r.page}`,
        tokens: Math.floor(r.text.length / 4),
        chars: r.text.length,
        mmr: r.score || 0.5,
        rerank: r.score || 0.5,
        neighbors: [],
        text: r.text,
      }));
      setRealResults(mapped);
      setExecuted(text);
      setSelected(1);
    } catch (err) {
      setRealResults([]);
    } finally {
      setLoading(false);
    }
  };

  const tookMs = 142;

  return (
    <div style={{ flex: 1, overflowY: "auto" }}>
      <div style={{ padding: "28px 32px 40px", maxWidth: 1320 }}>
        {/* Header row */}
        <div style={{ marginBottom: 20 }}>
          <h1 style={{ margin: 0, fontSize: 22, fontWeight: 600, letterSpacing: -0.3 }}>Retrieval</h1>
          <div style={{ color: "var(--fg-3)", fontSize: 13, marginTop: 4 }}>
            Inspect raw retrieval output. Run queries against the active pipeline and view ranked chunks with MMR and rerank scores.
          </div>
        </div>

        {/* Config bar */}

              display: "flex", alignItems: "center", gap: 6, padding: "6px 14px",

        </div>

        {/* Body */}
        {!executed && !loading ? (
          <div style={{
            border: "1px dashed var(--line-2)", borderRadius: 10, background: "var(--bg-1)",
            height: 380, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
            color: "var(--fg-3)", textAlign: "center",
          }}>
            <div style={{
              width: 38, height: 38, borderRadius: 8, background: "var(--bg-2)",

              color: "var(--accent)", marginBottom: 14
            }}>
              <Icon name="retrieval" size={18} />
            </div>
            <div style={{ fontSize: 15, color: "var(--fg)", marginBottom: 4, fontWeight: 500 }}>
              Enter a query to retrieve relevant chunks
            </div>
            <div style={{ fontSize: 12.5, marginBottom: 20, maxWidth: 440 }}>
              Results are ranked by MMR similarity and re-scored by the rerank model.
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center", maxWidth: 620 }}>
              {[
                "what backbone model is used in LayoutLMv3?",
                "best F1 score on FUNSD",
                "what is Entity Marker technique?",
                "LayoutLMv3 large parameter count",
              ].map(s => (
                <button key={s} onClick={() => { setQuery(s); run(s); }}
                  style={{
                    fontSize: 11.5, padding: "5px 10px", border: "1px solid var(--line)",
                    borderRadius: 999, color: "var(--fg-2)", background: "var(--bg-2)"

                  {s}
                </button>
              ))}
            </div>
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1.05fr)", gap: 20 }}>
            {/* Results list */}
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
                <div style={{ fontSize: 12, color: "var(--fg-3)" }}>

                </div>
                <div style={{ marginLeft: "auto", fontSize: 11, color: "var(--fg-4)" }} className="mono">
                  sorted by rerank
                </div>
              </div>
              {loading ? (
                <div style={{
                  border: "1px solid var(--line)", borderRadius: 8, background: "var(--bg-1)",
                  padding: "40px 24px", display: "flex", flexDirection: "column",
                  alignItems: "center", gap: 16,
                }}>
                  <div style={{ display: "inline-flex", gap: 6 }}>
                    <span className="dot-1" style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--accent)" }} />
                    <span className="dot-2" style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--accent)" }} />
                    <span className="dot-3" style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--accent)" }} />
                  </div>
                  <div style={{ fontSize: 13, color: "var(--fg-2)" }}>Retrieving chunks…</div>
                  <div className="mono" style={{ fontSize: 11, color: "var(--fg-4)" }}>
                    embedding query · top-20 · reranking top-10
                  </div>
                  <div style={{ width: "60%", height: 3, background: "var(--bg-3)", borderRadius: 2, overflow: "hidden", marginTop: 8 }}>
                    <div style={{
                      height: "100%", width: "40%", background: "var(--accent)",
                      animation: "shimmer 1.5s infinite",
                    }} />
                  </div>
                  <div style={{ fontSize: 11, color: "var(--fg-4)" }}>~30–60s on CPU</div>
                </div>
              ) : (
                results.map(r => (
                  <ResultCard key={r.rank} r={r} selected={selected === r.rank} onSelect={setSelected} />
                ))
              )}
            </div>

            {/* Full chunk panel */}
            <div style={{ position: "sticky", top: 16, alignSelf: "start", maxHeight: "calc(100vh - 200px)" }}>
              <FullChunkPanel chunk={loading ? null : selectedChunk} query={executed} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function MetricCard({ m }) {
  const delta = m.score - m.prev;
  const deltaColor = delta >= 0 ? "var(--green)" : "var(--red)";
  return (
    <div style={{
      border: "1px solid var(--line)", borderRadius: 10, background: "var(--bg-1)",
      padding: "16px 18px", display: "flex", flexDirection: "column", gap: 12, minWidth: 0,
    }}>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 12, color: "var(--fg-3)", fontWeight: 500 }}>{m.label}</div>
          <div style={{ fontSize: 11, color: "var(--fg-4)", marginTop: 2 }}>{m.desc}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <span className="mono" style={{ fontSize: 11, color: deltaColor }}>
            {delta >= 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(3)}
          </span>
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
        <div className="mono" style={{ fontSize: 30, fontWeight: 500, letterSpacing: -0.6, color: "var(--fg)", lineHeight: 1 }}>
          {m.score.toFixed(3)}
        </div>
        <div className="mono" style={{ fontSize: 12, color: "var(--fg-4)" }}>/ 1.000</div>
      </div>

      <div>
        <div style={{ height: 5, background: "var(--bg-3)", borderRadius: 3, overflow: "hidden", position: "relative" }}>
          <div style={{ position: "absolute", left: `${m.prev * 100}%`, top: -2, bottom: -2, width: 1, background: "var(--fg-4)" }} />
          <div style={{ height: "100%", width: `${m.score * 100}%`, background: m.score >= 0.85 ? "var(--green)" : m.score >= 0.75 ? "var(--accent)" : m.score >= 0.6 ? "var(--yellow)" : "var(--red)" }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5, fontSize: 10.5, color: "var(--fg-4)" }}>
          <span className="mono">prev {m.prev.toFixed(3)}</span>
          <span className="mono">{m.score >= 0.85 ? "good" : m.score >= 0.75 ? "ok" : "needs attention"}</span>
        </div>
      </div>
    </div>
  );
}

function StatusPill({ status }) {
  const cfg = {
    pass: { c: "var(--green)", l: "pass" },
    warn: { c: "var(--yellow)", l: "warn" },
    fail: { c: "var(--red)", l: "fail" },
  }[status];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5,
      color: cfg.c, textTransform: "capitalize",
    }}>
      <span style={{ width: 6, height: 6, borderRadius: "50%", background: cfg.c }} />
      <span className="mono">{cfg.l}</span>
    </span>
  );
}

function ScoreCell({ value }) {
  const c = value >= 0.85 ? "var(--green)" : value >= 0.75 ? "var(--accent)" : value >= 0.6 ? "var(--yellow)" : "var(--red)";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <div style={{ flex: 1, height: 3, background: "var(--bg-3)", borderRadius: 2, overflow: "hidden", minWidth: 50 }}>
        <div style={{ height: "100%", width: `${value * 100}%`, background: c }} />
      </div>
      <span className="mono" style={{ fontSize: 11.5, color: "var(--fg)", width: 40, textAlign: "right" }}>
        {value.toFixed(2)}
      </span>
    </div>
  );
}

function Evaluation({ phase, setPhase, progress, setProgress, results, setResults }) {
  const timerRef = React.useRef(null);

  const start = async () => {
    setPhase("running");
    setProgress(0);
    
    await fetch("/api/evaluate", { method: "POST" });
    
    timerRef.current = setInterval(async () => {
      const res = await fetch("/api/evaluate/status");
      const data = await res.json();
      setProgress(data.progress);
      
      if (data.state === "complete" || data.state === "failed") {
        clearInterval(timerRef.current);
        setResults(data.results);
        setPhase(data.state);
      }
    }, 3000);
  };

  React.useEffect(() => {
    fetch("/api/evaluate/status").then(r => r.json()).then(data => {
      if (data.results) {
        setResults(data.results);
        setPhase("complete");
      }
    });
  }, []);

  React.useEffect(() => () => clearInterval(timerRef.current), []);

  return (
    <div style={{ flex: 1, overflowY: "auto" }}>
      <div style={{ padding: "28px 32px 60px", maxWidth: 1320 }}>
        {/* Title row */}
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 32, marginBottom: 24 }}>
          <div style={{ flex: 1 }}>
            <h1 style={{ margin: 0, fontSize: 22, fontWeight: 600, letterSpacing: -0.3 }}>Evaluation</h1>
            <div style={{ color: "var(--fg-3)", fontSize: 13, marginTop: 4, maxWidth: 540 }}>
              Word overlap with ground truth on <span className="mono" style={{ color: "var(--fg-2)" }}>22</span> LayoutLMv3 paper questions.
            </div>
          </div>

          {/* Last run meta */}
          {phase === "complete" && (
            <div style={{ display: "flex", gap: 24, fontSize: 12 }}>
              {[
                ["Last run", "Mar 14, 09:12"],
                ["Duration", "3m 04s"],
                ["Model", "qwen2.5:3b"],
                ["Suite", "word-overlap-v1"],
              ].map(([k, v]) => (
                <div key={k} style={{ display: "flex", flexDirection: "column", gap: 2, minWidth: 0 }}>
                  <span style={{ fontSize: 10, color: "var(--fg-4)", textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 500 }}>{k}</span>
                  <span className="mono" style={{ color: "var(--fg)", fontSize: 12.5 }}>{v}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Run CTA panel */}
        <div style={{
          border: "1px solid var(--line)", borderRadius: 10, background: "var(--bg-1)",
          padding: "18px 20px", marginBottom: 24, display: "flex", alignItems: "center", gap: 24,
        }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13.5, fontWeight: 500, color: "var(--fg)", marginBottom: 2 }}>
              {phase === "running" ? "Evaluation in progress…" : phase === "idle" ? "Ready to evaluate" : "Run a new evaluation"}
            </div>
            <div style={{ fontSize: 12, color: "var(--fg-3)" }}>
              {phase === "running"
                ? <>Evaluating against <span className="mono" style={{ color: "var(--fg-2)" }}>production_rag</span> — embed query, retrieve top_k, generate, score.</>
                : <>Test set <span className="mono" style={{ color: "var(--fg-2)" }}>layoutlmv3-22.jsonl</span> · pipeline <span className="mono" style={{ color: "var(--fg-2)" }}>production_rag</span> · metric <span className="mono" style={{ color: "var(--fg-2)" }}>word-overlap</span></>
              }
            </div>

            {phase === "running" && (

                <div style={{ height: 6, background: "var(--bg-3)", borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${(progress / 22) * 100}%`, background: "var(--accent)" }} />
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 11, color: "var(--fg-3)" }} className="mono">
                  <span>{progress} / 22 questions evaluated</span>
                  <span style={{ color: "var(--fg-4)" }}>q{Math.min(progress + 1, 22)}: {EVAL_QUESTIONS[Math.min(progress, 21)].q.slice(0, 60)}…</span>

              flexShrink: 0,

            <Icon name="play" size={13} />
            {phase === "running" ? "Running…" : phase === "idle" ? "Run Evaluation" : "Run again"}

              {results ? [

                { key: "fail", label: "Fail", score: results.fail_count / results.total_questions, prev: 0, desc: `${results.fail_count} questions failed` },
              ].map(m => <MetricCard key={m.key} m={m} />) : EVAL_METRICS.map(m => <MetricCard key={m.key} m={m} />)}
            </div>

            {/* Results table */}
            <section style={{ border: "1px solid var(--line)", borderRadius: 10, background: "var(--bg-1)", overflow: "hidden" }}>

                  <button style={{ color: "inherit" }} className="mono">view trace ↗</button>
                </div>
              </div>

              {/* head */}
              <div style={{
                display: "grid",
                gridTemplateColumns: "32px minmax(0, 1.2fr) minmax(0, 1.4fr) 130px 130px 80px",
                padding: "0 16px", borderBottom: "1px solid var(--line)",
                fontSize: 10.5, color: "var(--fg-4)", textTransform: "uppercase", letterSpacing: 0.5,

              }}>

                <div>Question</div>
                <div>Answer</div>
                <div>Faithfulness</div>

                <div>Status</div>

                <div key={row.id} style={{
                  display: "grid",
                  gridTemplateColumns: "32px minmax(0, 1.2fr) minmax(0, 1.4fr) 130px 130px 80px",
                  padding: "11px 16px", fontSize: 12.5, alignItems: "center",
                  borderBottom: i === EVAL_QUESTIONS.length - 1 ? "none" : "1px solid var(--line)",
                  columnGap: 18,
                }}>

                </div>
              ))}
            </section>
          </>
        )}
      </div>
    </div>
  );
}

function CodeBlock({ children, lang = "python" }) {
  // very lightweight tokenizer — keywords, strings, numbers, comments
  const KW = /\b(import|from|def|class|return|if|else|for|in|None|True|False|as|with|async|await|yield)\b/g;
  const lines = String(children).split("\n");
  return (
    <div style={{
      border: "1px solid var(--line)", borderRadius: 8, background: "var(--bg-2)",
      overflow: "hidden",
    }}>
      <div style={{
        display: "flex", alignItems: "center", padding: "6px 12px",
        borderBottom: "1px solid var(--line)", background: "var(--bg-1)",
      }}>
        <span className="mono" style={{ fontSize: 11, color: "var(--fg-4)" }}>{lang}</span>
        <button style={{ marginLeft: "auto", fontSize: 11, color: "var(--fg-3)" }} className="mono">copy</button>
      </div>
      <div style={{ padding: "12px 14px", display: "grid", gridTemplateColumns: "auto 1fr", columnGap: 14, rowGap: 0 }}>
        {lines.map((line, i) => {
          // tokenize
          let html = line
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/(#.*$)/g, '<span style="color:var(--fg-4)">$1</span>')
            .replace(/("[^"]*")/g, '<span style="color:var(--green)">$1</span>')
            .replace(/(\b\d+\b)/g, '<span style="color:var(--purple)">$1</span>')
            .replace(KW, '<span style="color:var(--blue)">$&</span>');
          return (
            <React.Fragment key={i}>
              <div className="mono" style={{ fontSize: 11, color: "var(--fg-4)", textAlign: "right", userSelect: "none" }}>
                {i + 1}
              </div>
              <div className="mono" style={{ fontSize: 12.5, color: "var(--fg-2)", lineHeight: 1.65, whiteSpace: "pre" }}
                dangerouslySetInnerHTML={{ __html: html || "&nbsp;" }} />
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

                    <div>
                      <div style={{ fontSize: 13, color: "var(--fg)", fontWeight: 500, marginBottom: 3 }}>{l.title}</div>
                      <div style={{ fontSize: 12.5, color: "var(--fg-3)", lineHeight: 1.6 }}>{l.detail}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </DocsCard>

          {/* Roadmap */}
          <DocsCard id="roadmap" eyebrow="06" title="Roadmap">
            <div style={{ color: "var(--fg-3)", fontSize: 13, marginBottom: 18, lineHeight: 1.6 }}>
              Items in scope for the next two release cycles. Subject to change — see <span className="mono" style={{ color: "var(--fg-2)" }}>RFCs/</span> in the repo for proposals.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              {ROADMAP.map(r => (
                <div key={r.phase}>
                  <div className="mono" style={{ fontSize: 11.5, color: "var(--accent)", marginBottom: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>
                    {r.phase}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    {r.items.map(it => (
                      <div key={it.t} style={{
                        border: "1px solid var(--line)", borderRadius: 8, padding: "12px 14px",
                        background: "var(--bg-2)",
                      }}>
                        <div style={{ fontSize: 13, color: "var(--fg)", fontWeight: 500, marginBottom: 3 }}>{it.t}</div>
                        <div style={{ fontSize: 12, color: "var(--fg-3)", lineHeight: 1.5 }}>{it.s}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </DocsCard>

          {/* Footer */}
          <div style={{
            display: "flex", alignItems: "center", marginTop: 28, paddingTop: 18,
            borderTop: "1px solid var(--line)", fontSize: 12, color: "var(--fg-4)",
          }}>
            <span className="mono">docs/v1 · last edited mar 12 · maintained by core-infra</span>
            <span style={{ marginLeft: "auto", display: "flex", gap: 14 }}>
              <a href="https://github.com/tusher16/rag-studio" target="_blank" rel="noopener noreferrer" style={{ color: "var(--fg-3)", textDecoration: "none" }}>Edit on GitHub ↗</a>
              <a href="https://github.com/tusher16/rag-studio/issues" target="_blank" rel="noopener noreferrer" style={{ color: "var(--fg-3)", textDecoration: "none" }}>Report issue ↗</a>
            </span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- placeholder pages ---------- */
function Placeholder({ name }) {
  return (
    <div style={{ padding: "28px 32px" }}>
      <h1 style={{ margin: 0, fontSize: 22, fontWeight: 600, letterSpacing: -0.3 }}>{name}</h1>
      <div style={{ color: "var(--fg-3)", marginTop: 6, fontSize: 13 }}>Coming soon.</div>
      <div style={{
        marginTop: 24, border: "1px dashed var(--line-2)", borderRadius: 10,
        height: 320, display: "grid", placeItems: "center", color: "var(--fg-4)",
        background: "var(--bg-1)"
      }}>
        <span className="mono" style={{ fontSize: 12 }}>{name.toLowerCase()}.tsx</span>
      </div>
    </div>
  );
}

/* ---------- app ---------- */
function App() {
  const [active, setActive] = useState("pipeline");
  
  // Lifted state - persists across tab switches
  const [chatMessages, setChatMessages] = useState([]);
  const [chatLoading, setChatLoading] = useState(false);
  
  const [retrievalQuery, setRetrievalQuery] = useState("");
  const [retrievalExecuted, setRetrievalExecuted] = useState("");
  const [retrievalResults, setRetrievalResults] = useState([]);
  const [retrievalLoading, setRetrievalLoading] = useState(false);
  const [retrievalSelected, setRetrievalSelected] = useState(1);
  
  const [evalPhase, setEvalPhase] = useState("idle");
  const [evalProgress, setEvalProgress] = useState(0);
  const [evalResults, setEvalResults] = useState(null);
  const title = useMemo(() => NAV.find(n => n.id === active).label, [active]);

  return (
    <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
      <Sidebar active={active} setActive={setActive} />
      <main style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", height: "100vh" }} data-screen-label={title}>
        <Header title={title} />
        {active === "pipeline" ? (
          <div style={{ flex: 1, overflowY: "auto" }}><Pipeline /></div>
        ) : active === "chat" ? (
          <Chat messages={chatMessages} setMessages={setChatMessages} loading={chatLoading} setLoading={setChatLoading} />
        ) : active === "retrieval" ? (
          <Retrieval query={retrievalQuery} setQuery={setRetrievalQuery} executed={retrievalExecuted} setExecuted={setRetrievalExecuted} results={retrievalResults} setResults={setRetrievalResults} loading={retrievalLoading} setLoading={setRetrievalLoading} selected={retrievalSelected} setSelected={setRetrievalSelected} />
        ) : active === "evaluation" ? (
          <Evaluation phase={evalPhase} setPhase={setEvalPhase} progress={evalProgress} setProgress={setEvalProgress} results={evalResults} setResults={setEvalResults} />
        ) : active === "docs" ? (
          <Docs />
        ) : (
          <div style={{ flex: 1, overflowY: "auto" }}><Placeholder name={title} /></div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
